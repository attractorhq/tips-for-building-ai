name: Ask a question
description: Ask how a tip applies to a real product situation
title: "[Question]: "
labels: [question, triage]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the workflow and decision without sharing sensitive data.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Sensitive information
      options:
        - label: I have removed credentials, personal data, and confidential information.
          required: true
